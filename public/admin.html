<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark}body{margin:0;background:#0d0d0f;color:#eee;font:16px/1.5 system-ui,sans-serif;padding:24px;max-width:980px;margin-inline:auto}
h1{font-size:28px;margin:0 0 6px}p.s{color:#9a9aa3;margin:0 0 22px}
.card{border:1px solid #2a2a30;border-radius:14px;padding:16px 18px;margin:0 0 12px;display:grid;gap:8px;background:#141418}
.card.wait{border-color:#c9a227}.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}.big{font:700 22px system-ui}
.utr{font:700 20px ui-monospace,monospace;letter-spacing:1px}.m{color:#9a9aa3;font-size:14px}
button{border:0;border-radius:10px;padding:11px 18px;font:600 15px system-ui;cursor:pointer}.ok{background:#1f8f5a;color:#fff}.no{background:#2a2a30;color:#eee}
.sum{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px}.sum div{flex:1;min-width:180px;border:1px solid #2a2a30;border-radius:14px;padding:14px 18px;background:#141418}.sum b{display:block;font:700 26px system-ui}.sum span{color:#9a9aa3;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{background:#1b1b20;color:#ccc}.tab.on{background:#eee;color:#000}.tab .n{opacity:.7;margin-left:4px}
.pill.expired,.pill.failed,.pill.cancelled{background:#6b2a2a}.pill{padding:2px 10px;border-radius:99px;background:#2a2a30;font-size:13px}.pill.paid{background:#1f8f5a}.pill.pending_verification{background:#c9a227;color:#000}
