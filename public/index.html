      else if(c.length===1){const [w,d]=c[0].split('|'),f=lib.files.find(x=>x.wallpaperId===w&&x.device===d);if(f)cards.push({img:`/api/preview/${w}/${d}`,title:skuTitle(id),sub:`${DL[d]} · ${f.width} × ${f.height}`,url:f.url,label:'Download'})}});
    box.innerHTML=`<svg class="tick" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54"/><path d="M38 62l16 16 30-34"/></svg>
     <span class="sub mono">Order ${esc(o.id.slice(0,8))} · ${inr(o.amountPaise)} paid</span>
     <h1 class="cond" style="font-size:clamp(70px,13vw,200px)">${chars('Thank',0)} <span class="ital" style="color:var(--acc)">${chars('you',300)}</span></h1>
     <p style="color:var(--bone-2);font-size:19px;margin-top:20px">Payment confirmed. Your wallpapers are unlocked.</p>
     <div class="dl">${cards.map((c,i)=>`<div class="dlc rv in" style="--d:${i*120}ms"><img src="${esc(c.img)}" alt="" style="${/iPhone|Android/.test(c.sub)?'aspect-ratio:auto;max-height:300px;object-fit:contain':''}"><div class="r"><div><b style="font:700 18px var(--f-d)">${esc(c.title)}</b><div class="mono" style="color:var(--mut)">${esc(c.sub)}</div></div><a class="btn" style="padding:12px 18px" href="${esc(c.url)}" download>${c.label}</a></div></div>`).join('')}</div>
     <div class="cta" style="justify-content:center;margin-top:44px"><button class="btn" data-go="dashboard">Open my downloads <span class="arrow">→</span></button></div>`;
    if(!celebrated){celebrated=true;confetti()}
  }
  function paint(o){
    if(o.status==='paid')return paintPaid(o);
    if(['failed','cancelled','expired'].includes(o.status)){
      const msg={failed:'The payment did not go through.',cancelled:'The payment was cancelled.',expired:'The payment window expired.'}[o.status];
      box.innerHTML=`<span class="sub mono">Order ${esc(o.id.slice(0,8))}</span><h1 class="cond" style="font-size:clamp(60px,11vw,160px)">${chars('Not',0)} <span class="ital" style="color:var(--acc)">${chars('paid',300)}</span></h1>
       <p style="color:var(--bone-2);font-size:19px;margin-top:20px">${msg} You have not been charged by Inkdrift. If money left your account, it will be matched automatically or you can contact us with your order number.</p>
       <div class="cta" style="justify-content:center;margin-top:34px"><button class="btn" id="retry">Try again <span class="arrow">→</span></button><button class="btn ghost" data-go="contact">Contact support</button></div>`;
      $('#retry').onclick=()=>{st.cart=o.items.map(i=>i.productId);renderCart();go('checkout')};return;
    }
    const review=o.status==='pending_verification';
    if(o.payment&&o.payment.manual&&!review){
      const u=o.payment.upi;
      if(!u){box.innerHTML='<p>Loading payment details…</p>';return}
      if(box.dataset.upi===o.id)return;box.dataset.upi=o.id;
      box.innerHTML=`<span class="sub mono">Order ${esc(o.id.slice(0,8))} · ${inr(o.amountPaise)}</span>
       <h1 class="cond" style="font-size:clamp(46px,8vw,110px)">Pay with <span class="ital" style="color:var(--acc)">UPI</span></h1>
       <div class="upi" style="display:grid;gap:26px;max-width:560px;margin:26px auto 0;text-align:left">
        <div style="background:#fff;border-radius:18px;padding:14px;width:min(260px,70vw);margin:0 auto" aria-label="UPI QR code">${u.qrSvg}</div>
        <ol style="color:var(--bone-2);font-size:17px;line-height:1.7;padding-left:22px;margin:0">
         <li>Scan the QR with any UPI app, or pay to <b class="mono" id="upiId">${esc(u.upiId)}</b> <button class="btn ghost" id="cpUpi" type="button" style="padding:4px 12px">Copy</button></li>
         <li>Pay exactly <b>${inr(o.amountPaise)}</b> (${esc(u.payeeName)}). The note already has your order reference.</li>
         <li>After paying, open the payment details in your UPI app and copy the 12-digit <b>UTR / reference number</b>.</li>
         <li>Enter it below. We check it against our bank and unlock your downloads.</li></ol>
        <a class="btn" href="${esc(u.link)}" style="justify-content:center">Open my UPI app <span class="arrow">→</span></a>
        <form id="utrF" novalidate style="display:grid;gap:12px"><label class="mono" for="utrI" style="color:var(--mut)">UTR / UPI reference (12 digits)</label>
         <input id="utrI" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="e.g. 412345678901" style="padding:16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:600 20px var(--f-m,monospace)">
         <div id="utrErr" role="alert" style="color:#ff7a7a;min-height:20px"></div>
         <button class="btn" id="utrB" type="submit">I have paid · Submit UTR <span class="arrow">→</span></button></form>
        <button class="btn ghost" id="cxl" type="button" style="justify-self:center">Cancel order</button></div>`;
      $('#cpUpi').onclick=()=>{try{navigator.clipboard.writeText(u.upiId);toast('UPI ID copied')}catch(_){toast(u.upiId)}};
      $('#utrF').onsubmit=async e=>{e.preventDefault();const v=$('#utrI').value.replace(/\s+/g,'');const er=$('#utrErr');er.textContent='';
        if(!/^\d{12}$/.test(v)){er.textContent='The UTR is a 12-digit number.';return}
        $('#utrB').disabled=true;try{await api('POST',`/api/orders/${oid}/utr`,{utr:v});box.dataset.upi='';tick(true)}catch(ex){er.textContent=ex.message||'Could not submit.';$('#utrB').disabled=false}};
      $('#cxl').onclick=async()=>{try{await api('POST',`/api/orders/${oid}/cancel`,{});box.dataset.upi='';tick(true)}catch(e){toast(e.message)}};
      return;
    }
    const manualReview=review&&o.payment&&o.payment.manual;
    box.dataset.upi='';
    box.innerHTML=`<div class="wait"></div><span class="sub mono">Order ${esc(o.id.slice(0,8))} · ${inr(o.amountPaise)}</span>
     <h1 class="cond" style="font-size:clamp(50px,9vw,120px)">${review?'Verifying':'Confirming'} <span class="ital" style="color:var(--acc)">payment</span></h1>
     <p style="color:var(--bone-2);font-size:19px;margin-top:20px">${manualReview?`We have your UTR (${esc(o.payment.utr||'')}). The shop owner is matching it with the bank credit and will unlock your downloads soon. This page updates by itself, and you can close it and come back from My account.`:review?'Your payment needs a quick manual check. This can take a little while.':'Waiting for your bank to confirm. This usually takes under a minute after you pay.'} You can leave this page open.</p>
     <div class="cta" style="justify-content:center;margin-top:30px">${o.payment&&o.payment.checkoutUrl?`<a class="btn ghost" href="${esc(o.payment.checkoutUrl)}">Return to payment</a>`:''}${manualReview?'':'<button class="btn ghost" id="cxl">Cancel payment</button>'}</div>`;
    if($('#cxl'))$('#cxl').onclick=async()=>{try{await api('POST',`/api/orders/${oid}/cancel`,{});tick(true)}catch(e){toast(e.message)}};
  }
  async function tick(once){
    if(stopped)return;
    try{const {order}=await api('GET','/api/orders/'+encodeURIComponent(oid));paint(order);if(FINAL.includes(order.status)||once===true&&FINAL.includes(order.status))return}
    catch(e){if(e.status===404||e.status===401){box.innerHTML=`<h1 class="cond" style="font-size:clamp(50px,9vw,120px)">Order not found</h1><div class="cta" style="justify-content:center;margin-top:30px"><button class="btn" data-go="dashboard">Open my account</button></div>`;return}}
    if(++n<200&&!stopped)setTimeout(tick,n<10?3000:6000);
  }
  tick();
}

function initContact(){
  $('#ctF').onsubmit=e=>{e.preventDefault();let ok=true;[['ctN',v=>v.length>1],['ctE',v=>/^\S+@\S+\.\S+$/.test(v)],['ctM',v=>v.length>4]].forEach(([id,fn])=>{const i=$('#'+id);i.parentElement.classList.remove('err');void i.offsetWidth;if(!fn(i.value.trim())){i.parentElement.classList.add('err');ok=false}});if(ok)toast('Preview only: messages are not delivered yet.')};
}

/* ================= lightbox ================= */
const ORDER_W=PACKS.flatMap(p=>p.w.map((_,k)=>wid(p.num,k+1)));
let lb={w:ORDER_W[0],d:'windows',opt:'single'};
function openLBw(w,d){const dev=DEVS.includes(d)?d:st.dev;lb={w,d:variant(w,dev)?dev:(DEVS.find(x=>variant(w,x))||dev),opt:'single'};showLB(true);$('#lb').classList.add('on');document.body.classList.add('lock')}
function openLB(p,k,m){openLBw(wid(p,k),m==='phone'?'iphone':m==='laptop'?'windows':st.dev)}
/* The wallpaper page: choose a device, see that device's exact shape, then add that exact file to the cart. */
function lbInfo(){
  const w=W(lb.w),pk=pack(w.pack_id),v=variant(lb.w,lb.d),n=ORDER_W.indexOf(lb.w)%5;
  const single=st.sku.get(skuOf(lb.w,lb.d)),all=st.sku.get(skuOf(lb.w,'all'));
  const ownThis=owns(lb.w,lb.d),ownAllDev=DEVS.every(d=>!variant(lb.w,d)||owns(lb.w,d));
  const opt=lb.opt==='all'&&all?'all':'single',cur=opt==='all'?all:single;
  const nAll=DEVS.filter(d=>variant(lb.w,d)).length;
  $('#lbInfo').innerHTML=`<span class="mono" style="color:var(--mut)">Vol. ${esc(pk.n)} · ${esc(pk.name)}</span><h3 class="cond">${esc(w.title)}</h3><p>${esc(pk.tag)}</p>
   <span class="mono" style="color:var(--mut)">Choose your device</span>${devPick('data-ld',lb.d,d=>!!variant(lb.w,d))}
   ${v?`<dl class="mono"><dt>Device</dt><dd>${esc(DL[lb.d])}</dd><dt>Resolution</dt><dd>${esc(resTxt(v))}</dd><dt>Orientation</dt><dd>${lb.d==='iphone'||lb.d==='android'?'Portrait':'Landscape'}</dd><dt>Size note</dt><dd>${lb.d==='iphone'||lb.d==='android'?`Whole painting kept in frame; the background is extended to fill the tall screen. Painting enlarged ${v.upscale}× from ${v.source_w} × ${v.source_h}`:`Cut from the ${v.source_w} × ${v.source_h} original, enlarged ${v.upscale}×`}</dd><dt>Format</dt><dd>JPG</dd></dl>`
     :`<p class="na">Not Available for This Device</p>`}
   ${!v?`<button class="btn" disabled>Not Available for This Device</button>`
    :ownThis&&(opt==='single'||ownAllDev)?`<span class="mono" style="color:var(--mut)">You own this · no watermark</span><a class="btn" href="/api/file/${esc(lb.w)}/${esc(lb.d)}" download>Download for ${esc(DL[lb.d])} <span class="arrow">↓</span></a><span class="note">Find it again any time in My downloads.</span>`
    :`<div class="opts" role="group" aria-label="Purchase option"><button type="button" class="op ${opt==='single'?'on':''}" data-lo="single"><b>This device</b><span>${esc(DL[lb.d])} only</span><em>${single?inr(single.price_paise):''}</em></button>${all?`<button type="button" class="op ${opt==='all'?'on':''}" data-lo="all"><b>All devices</b><span>${nAll} versions</span><em>${inr(all.price_paise)}</em></button>`:''}</div>
      <button class="btn" id="lbBuy">Add to cart · ${cur?inr(cur.price_paise):''} <span class="arrow">→</span></button><span class="note">You see a watermarked, low-resolution preview here. The clean file is sent only after payment.</span>`}`;
  $$('#lbInfo [data-ld]').forEach(b=>b.onclick=()=>{lb.d=b.dataset.ld;setDev(lb.d);showLB()});
  $$('#lbInfo [data-lo]').forEach(b=>b.onclick=()=>{lb.opt=b.dataset.lo;lbInfo()});
  const b=$('#lbBuy');if(b)b.onclick=()=>{const id=cur.id;closeLB();add(id,$('#lbImg'))};
}
function showLB(first){const im=$('#lbImg');im.src=PVd(lb.w,lb.d);im.alt=W(lb.w).title;im.draggable=false;const pk=pack(W(lb.w).pack_id);$('#lbCap').textContent=`Vol. ${pk.n} · ${W(lb.w).title} · ${DL[lb.d]}`;lbInfo();im.animate([{opacity:0,transform:first?'scale(.8) translateY(30px)':'translateX(40px)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.16,1,.3,1)'})}
function stepLB(d){const i=(ORDER_W.indexOf(lb.w)+d+20)%20;lb.w=ORDER_W[i];if(!variant(lb.w,lb.d))lb.d=DEVS.find(x=>variant(lb.w,x))||lb.d;lb.opt='single';showLB()}
function closeLB(){$('#lb').classList.remove('on');document.body.classList.remove('lock')}
$('#lbX').onclick=closeLB;$('#lbP').onclick=()=>stepLB(-1);$('#lbN').onclick=()=>stepLB(1);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB()});

/* ================= confetti ================= */
function confetti(){
  if(rm)return;
  const cv=$('#conf'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#c4502f','#ece7db','#e9a93c','#ef5a36','#8ea0ff'];
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.55,vx:(Math.random()-.5)*18,vy:-Math.random()*18-6,r:3+Math.random()*7,c:cols[Math.random()*5|0],rot:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t0=performance.now();
  (function f(t){c.clearRect(0,0,cv.width,cv.height);const k=(t-t0)/3200;ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.rot+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.max(0,1-k);c.fillStyle=p.c;c.beginPath();c.ellipse(0,0,p.r,p.r*.55,0,0,6.28);c.fill();c.restore()});if(k<1)requestAnimationFrame(f);else c.clearRect(0,0,cv.width,cv.height)})(t0);
}

/* ================= preview protection (deterrent; originals never leave the server before purchase) ================= */
const PROT='img,.bimg,.drow,.wp,.pc-img,.sc,.hs-c,.mason figure,.strip,.scr,.stack,.ba,.dlc,#lb .lbw,[data-lb]';
const isPrev=t=>t&&t.closest&&t.closest(PROT);
['contextmenu','dragstart','selectstart','copy','cut'].forEach(ev=>document.addEventListener(ev,e=>{if(isPrev(e.target)||isPrev(document.activeElement)&&ev==='copy')e.preventDefault()},true));
const lockImgs=r=>(r.querySelectorAll?r.querySelectorAll('img:not([draggable="false"])'):[]).forEach(i=>{i.draggable=false});
lockImgs(document);new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.tagName==='IMG')n.draggable=false;else lockImgs(n)}}))).observe(document.body,{childList:true,subtree:true});

/* ================= global events ================= */
document.addEventListener('click',e=>{
  const dv=e.target.closest('[data-dev]');if(dv){st.bdev=dv.dataset.dev;setDev(dv.dataset.dev)}
  const lw=e.target.closest('[data-lbw]');if(lw&&!e.target.closest('[data-add],[data-go]')){openLBw(lw.dataset.lbw,lw.dataset.lbd);return}
  const a=e.target.closest('[data-add]');if(a){e.preventDefault();e.stopPropagation();add(a.dataset.add,a);return}
  const r=e.target.closest('[data-rm]');if(r){remove(r.dataset.rm);return}
  const d=e.target.closest('[data-dl]');if(d){toast(d.dataset.dl+' ZIP: the live shop downloads this file');return}
  const l=e.target.closest('[data-lb]');if(l&&!e.target.closest('[data-go]')){const [p,k]=l.dataset.lb.split('-').map(Number);openLB(p,k);return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go,e,g.dataset.scroll);return}
});
document.addEventListener('change',e=>{const c=e.target.closest&&e.target.closest('[data-chg]');if(c)changeDevice(c.dataset.chg,c.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeLB();closeDrawer();closeModal();closeMenu()}
  if($('#lb').classList.contains('on')){if(e.key==='ArrowRight')stepLB(1);if(e.key==='ArrowLeft')stepLB(-1)}
  if((e.key==='Enter')&&e.target.matches&&e.target.matches('[role=link]'))go(e.target.dataset.go,null);
});
$('#cartBtn').onclick=openDrawer;$('#dClose').onclick=closeDrawer;$('#scrim').onclick=()=>{closeDrawer();closeMenu()};
$('#burger').onclick=()=>document.body.classList.toggle('menu-open');
addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(VIEWS[n]&&n!==st.route&&!busy)go(n)});

/* modal */
function openModal(){$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
let exitShown=false;
document.addEventListener('mouseleave',e=>{if(e.clientY<=0&&!exitShown&&st.route!=='checkout'&&st.route!=='done'&&document.getElementById('loader').classList.contains('out')){exitShown=true;openModal()}});
$('#mX').onclick=closeModal;$('#mNo').onclick=closeModal;
$('#mApply').onclick=()=>{st.coupon='INK15';closeModal();toast('15% off saved. It applies at checkout.');renderCart()};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* scroll */
let ticking=false,lastY=0;
function onScroll(){
  const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
  $('#progress').style.transform=`scaleX(${h>0?y/h:0})`;
  const hd=$('#hdr');hd.classList.toggle('stuck',y>40);hd.classList.toggle('hide',y>lastY&&y>400&&!document.body.classList.contains('menu-open'));lastY=y;
  const hs=$('#hs');if(hs){const r=hs.getBoundingClientRect(),t=$('#hsT'),span=hs.offsetHeight-innerHeight,p=Math.max(0,Math.min(1,-r.top/span));t.style.transform=`translateX(${-p*(t.scrollWidth-innerWidth+80)}px)`;$('#hsB').style.transform=`scaleX(${p})`}
  ticking=false;
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});

/* cursor */
(function(){
  if(!matchMedia('(pointer:fine)').matches)return;
  const dot=$('#cDot'),ring=$('#cRing'),txt=$('#cTxt');let x=0,y=0,rx=0,ry=0;
  addEventListener('pointermove',e=>{x=e.clientX;y=e.clientY;document.body.classList.add('cur-on');dot.style.transform=`translate(${x}px,${y}px)`;
    const t=e.target.closest&&e.target.closest('[data-cursor]');if(t){txt.textContent=t.dataset.cursor;document.body.classList.add('cur-big')}else document.body.classList.remove('cur-big');
    const hv=e.target.closest&&e.target.closest('a,button,input,textarea,[role=link]');ring.style.borderWidth=hv&&!t?'2px':'1px'});
  document.addEventListener('mouseleave',()=>document.body.classList.remove('cur-on'));
  (function f(){rx+=(x-rx)*.16;ry+=(y-ry)*.16;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(f)})();
})();

/* announce bar */
(function(){const m=['20 wallpapers in four volumes','Exact sizes for iPhone, Android, Windows and Mac','Prices in INR. Pay with UPI','One payment, no subscription'];$('#mqBar').innerHTML=[...m,...m].map(t=>`<span class="mono">${t}</span>`).join('')})();

/* ================= loader ================= */
function runLoader(replay){
  const L=$('#loader');
  $('#ldWord').innerHTML=[...'INK'].map((c,i)=>`<span class="c" style="--i:${i}">${c}</span>`).join('')+`<span class="ital">${[...'drift'].map((c,i)=>`<span class="c" style="--i:${i+3}">${c}</span>`).join('')}</span>`;
  L.classList.remove('out');L.style.display='';
  const d=$('.drop',L);d.style.animation='none';void d.offsetWidth;d.style.animation='';
  document.body.classList.remove('ready');document.body.classList.add('lock');
  const dur=rm?200:1900,t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/dur),n=Math.round(100*(1-Math.pow(1-k,2)));$('#ldN').textContent=n;$('#ldBar').style.width=n+'%';
    if(k<1)requestAnimationFrame(f);else{
      L.classList.add('out');
      setTimeout(()=>{document.body.classList.remove('lock');L.style.display='none';
        const first=!st.route||replay;
        if(replay){st.route=null}
        const n=(location.hash.slice(1));
        let target=replay?'home':(VIEWS[n]?n:'home');if(target==='dashboard'&&!st.user){st.next='dashboard';target='login'}mount(target);
        document.body.classList.add('ready');
      },rm?10:450);
    }})(t0);
}
loadCart();
loadSession().finally(()=>{renderCart();runLoader()});
</script>
