let lb={p:1,k:1,m:'laptop'};
function openLB(p,k,m='laptop'){lb={p,k,m};showLB(true);$('#lb').classList.add('on');document.body.classList.add('lock')}
function showLB(first){const im=$('#lbImg');im.src=lb.m==='phone'?Ph(lb.p,lb.k):D(lb.p,lb.k);const pk=PACKS[lb.p-1];$('#lbCap').textContent=`Vol. ${pk.n} · ${pk.w[lb.k-1]}`;im.animate([{opacity:0,transform:first?'scale(.8) translateY(30px)':'translateX(40px)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.16,1,.3,1)'})}
function stepLB(d){let n=(lb.p-1)*5+(lb.k-1)+d;n=(n+20)%20;lb.p=Math.floor(n/5)+1;lb.k=n%5+1;showLB()}
function closeLB(){$('#lb').classList.remove('on');document.body.classList.remove('lock')}
$('#lbX').onclick=closeLB;$('#lbP').onclick=()=>stepLB(-1);$('#lbN').onclick=()=>stepLB(1);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB()});

/* ================= confetti ================= */
function confetti(){
  if(rm)return;
  const cv=$('#conf'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#2d44ff','#ece7db','#e9a93c','#ef5a36','#8ea0ff'];
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.55,vx:(Math.random()-.5)*18,vy:-Math.random()*18-6,r:3+Math.random()*7,c:cols[Math.random()*5|0],rot:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t0=performance.now();
  (function f(t){c.clearRect(0,0,cv.width,cv.height);const k=(t-t0)/3200;ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.rot+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.max(0,1-k);c.fillStyle=p.c;c.beginPath();c.ellipse(0,0,p.r,p.r*.55,0,0,6.28);c.fill();c.restore()});if(k<1)requestAnimationFrame(f);else c.clearRect(0,0,cv.width,cv.height)})(t0);
}

/* ================= global events ================= */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]');if(a){e.preventDefault();e.stopPropagation();add(a.dataset.add,a);return}
  const r=e.target.closest('[data-rm]');if(r){remove(r.dataset.rm);return}
  const d=e.target.closest('[data-dl]');if(d){toast(d.dataset.dl+' ZIP: the live shop downloads this file');return}
  const l=e.target.closest('[data-lb]');if(l&&!e.target.closest('[data-go]')){const [p,k]=l.dataset.lb.split('-').map(Number);openLB(p,k);return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go,e,g.dataset.scroll);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeLB();closeDrawer();closeModal();closeMenu()}
  if($('#lb').classList.contains('on')){if(e.key==='ArrowRight')stepLB(1);if(e.key==='ArrowLeft')stepLB(-1)}
  if((e.key==='Enter')&&e.target.matches&&e.target.matches('[role=link]'))go(e.target.dataset.go,null);
});
$('#cartBtn').onclick=openDrawer;$('#dClose').onclick=closeDrawer;$('#scrim').onclick=()=>{closeDrawer();closeMenu()};
$('#burger').onclick=()=>document.body.classList.toggle('menu-open');
$$('[data-cur]').forEach(b=>b.onclick=()=>{st.cur=b.dataset.cur;updatePrices()});
addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(VIEWS[n]&&n!==st.route&&!busy)go(n)});

/* modal */
function openModal(){$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
let exitShown=false;
document.addEventListener('mouseleave',e=>{if(e.clientY<=0&&!exitShown&&st.route!=='checkout'&&st.route!=='done'&&document.getElementById('loader').classList.contains('out')){exitShown=true;openModal()}});
$('#mX').onclick=closeModal;$('#mNo').onclick=closeModal;
$('#mApply').onclick=()=>{st.coupon='INK15';closeModal();toast('15% off saved. It applies at checkout.');renderCart()};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* scroll */
let ticking=false,lastY=0;
function onScroll(){
  const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
  $('#progress').style.transform=`scaleX(${h>0?y/h:0})`;
  const hd=$('#hdr');hd.classList.toggle('stuck',y>40);hd.classList.toggle('hide',y>lastY&&y>400&&!document.body.classList.contains('menu-open'));lastY=y;
  const hs=$('#hs');if(hs){const r=hs.getBoundingClientRect(),t=$('#hsT'),span=hs.offsetHeight-innerHeight,p=Math.max(0,Math.min(1,-r.top/span));t.style.transform=`translateX(${-p*(t.scrollWidth-innerWidth+80)}px)`;$('#hsB').style.transform=`scaleX(${p})`}
  ticking=false;
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});

/* cursor */
(function(){
  if(!matchMedia('(pointer:fine)').matches)return;
  const dot=$('#cDot'),ring=$('#cRing'),txt=$('#cTxt');let x=0,y=0,rx=0,ry=0;
  addEventListener('pointermove',e=>{x=e.clientX;y=e.clientY;document.body.classList.add('cur-on');dot.style.transform=`translate(${x}px,${y}px)`;
    const t=e.target.closest&&e.target.closest('[data-cursor]');if(t){txt.textContent=t.dataset.cursor;document.body.classList.add('cur-big')}else document.body.classList.remove('cur-big');
    const hv=e.target.closest&&e.target.closest('a,button,input,textarea,[role=link]');ring.style.borderWidth=hv&&!t?'2px':'1px'});
  document.addEventListener('mouseleave',()=>document.body.classList.remove('cur-on'));
  (function f(){rx+=(x-rx)*.16;ry+=(y-ry)*.16;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(f)})();
})();

/* announce bar */
(function(){const m=['Launch week: 20% off with code INK20','20 wallpapers · 4K · laptop + phone','Instant download, yours forever','All 4 packs for the price of 2.6'];$('#mqBar').innerHTML=[...m,...m].map(t=>`<span class="mono">${t}</span>`).join('')})();

/* ================= loader ================= */
function runLoader(replay){
  const L=$('#loader');
  $('#ldWord').innerHTML=[...'INK'].map((c,i)=>`<span class="c" style="--i:${i}">${c}</span>`).join('')+`<span class="ital">${[...'drift'].map((c,i)=>`<span class="c" style="--i:${i+3}">${c}</span>`).join('')}</span>`;
  L.classList.remove('out');L.style.display='';
  const d=$('.drop',L);d.style.animation='none';void d.offsetWidth;d.style.animation='';
  document.body.classList.remove('ready');document.body.classList.add('lock');
  const dur=rm?200:1900,t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/dur),n=Math.round(100*(1-Math.pow(1-k,2)));$('#ldN').textContent=n;$('#ldBar').style.width=n+'%';
    if(k<1)requestAnimationFrame(f);else{
      L.classList.add('out');
      setTimeout(()=>{document.body.classList.remove('lock');L.style.display='none';
        const first=!st.route||replay;
        if(replay){st.route=null}
        const n=(location.hash.slice(1));
        let target=replay?'home':(VIEWS[n]?n:'home');if(target==='dashboard'&&!st.user){st.next='dashboard';target='login'}mount(target);
        document.body.classList.add('ready');
      },rm?10:450);
    }})(t0);
}
loadCart();
loadSession().finally(()=>{renderCart();runLoader()});
</script>
