services:
  - type: web
    name: inkdrift-shop
    runtime: node
    plan: starter            # persistent disk needs a paid plan (about $7/month)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: inkdrift-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/inkdrift.sqlite
      - key: PACKS_DIR
        value: /var/data/packs
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: YOUPI_API_URL
        sync: false
      - key: YOUPI_MERCHANT_ID
        sync: false
      - key: YOUPI_MERCHANT_API_KEY
        sync: false
      - key: YOUPI_WEBHOOK_SECRET
        sync: false
      - key: YOUPI_UNLOCK_POLICY
        value: reconciled
